/lane_costmap_node:
  ros__parameters:
    # Kalibrierung Bird's-Eye-Pixel -> Meter, siehe Docstring in lane_costmap_node.py.
    # Muss am Wettbewerbstag mit Massband gegen die tatsaechliche Kameramontage
    # kalibriert werden -- die Werte hier sind nur Platzhalter.
    x_near: 0.15
    x_far: 0.60
    y_left: 0.35
    y_right: -0.35

    frame_id: base_footprint
    output_topic: /detect/lane_obstacles
    pixel_stride: 2

/nav2_goal_publisher:
  ros__parameters:
    goal_distance: 1.0
    goal_frame_id: base_footprint
    num_waypoints: 5
    watchdog_rate: 1.0

/keepout_zone_node:
  ros__parameters:
    frame_id: odom
    robot_frame: base_footprint
    output_topic: /detect/tunnel_entrance_obstacle
    entrance_wall_width: 0.6
    entrance_wall_points: 9
    publish_rate: 5.0

/tunnel_explorer_node:
  ros__parameters:
    recompute_rate: 1.0
    arrival_radius: 0.3
    stall_timeout: 10.0
    free_cost_threshold: 50
    min_frontier_cluster_cells: 6
    entrance_weight: 1.0
    robot_distance_weight: 0.3
    frame_id: odom
    robot_frame: base_footprint
    costmap_topic: /global_costmap/costmap
    output_path_topic: /tunnel/explore_path
