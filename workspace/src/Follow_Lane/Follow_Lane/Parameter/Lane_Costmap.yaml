/lane_costmap_node:
  ros__parameters:
    # Spurwaende fuer den lane_layer und Spurmitte als Pfad, in jedem Modus ausser
    # Tunnel (Kamera dort verboten), siehe Docstring in lane_costmap_node.py.
    # Pixel -> Meter kommt aus Parameter/camera_info/ground_homography_800x600.yaml.
    # Wurde die Kamera verstellt, die Datei mit scripts/tb/ground-calib.py neu
    # erzeugen und ground_x_min/ground_x_max pruefen.
    ground_homography_file: ground_homography_800x600.yaml
    # Gueltigkeitsbereich der Homographie (X vorwaerts ab Radachse, Meter).
    # ground_x_max: die Marker beim Fit reichten nur bis 0.70 m, darueber hinaus
    # wird extrapoliert und die Fehler wachsen stark.
    ground_x_min: 0.15
    ground_x_max: 0.80

    frame_id: base_footprint
    output_topic: /detect/lane_obstacles
    pixel_stride: 2

    # Spurmitte: keine Spurbreite einstellen -- sie wird laufend gemessen.
    odom_frame: odom
    center_path_topic: /lane/center_path
    center_bin_size: 0.05        # = Zellgroesse der local_costmap
    center_min_points: 3
    center_width_history: 20     # Bilder; Median der gemessenen Breite

/nav2_goal_publisher:
  ros__parameters:
    # Obstacle-Modus: Ziel ist die Spurmitte, solange sie juenger ist als
    # center_path_max_age (Empfangszeit). Sonst die Gerade goal_distance geradeaus.
    center_path_topic: /lane/center_path
    center_path_max_age: 1.0
    goal_distance: 1.0
    goal_frame_id: base_footprint
    num_waypoints: 5
    watchdog_rate: 1.0

/keepout_zone_node:
  ros__parameters:
    frame_id: odom
    robot_frame: base_footprint
    output_topic: /detect/tunnel_entrance_obstacle
    entrance_wall_width: 0.6
    entrance_wall_points: 9
    publish_rate: 5.0

/tunnel_explorer_node:
  ros__parameters:
    recompute_rate: 1.0
    arrival_radius: 0.3
    stall_timeout: 10.0
    free_cost_threshold: 50
    min_frontier_cluster_cells: 6
    entrance_weight: 1.0
    robot_distance_weight: 0.3
    frame_id: odom
    robot_frame: base_footprint
    costmap_topic: /global_costmap/costmap
    output_path_topic: /tunnel/explore_path
