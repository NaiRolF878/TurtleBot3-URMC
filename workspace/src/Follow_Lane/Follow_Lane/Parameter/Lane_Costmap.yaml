/lane_costmap_node:
  ros__parameters:
    # Spurgedaechtnis: eine Zelle wird erst nach so vielen Kamerabildern in Folge zur
    # Linie bzw. wieder frei.
    line_confirm_frames: 3
    free_confirm_frames: 10
    # m um die Linienmitte, die Wand wird; 0 = nur die Mitte (die Spur ist sonst zu eng).
    line_margin: 0.0

/nav2_goal_publisher:
  ros__parameters:
    # Obstacle-Modus: Planziel goal_distance (m) voraus auf der Spurmitte.
    goal_distance: 1.0
    # Planwege, die weiter als das (m) hinter die Radachse fuehren, werden verworfen.
    max_path_backward: 0.12
