# Parameter fuer safety_node (LiDAR-Not-Aus, Prioritaet 1 im Mux).
#
# Flaches Format (name: wert), passend zu load_flat_params im Launch.

# Alles naeher als das loest den Not-Aus aus (Meter).
#
# Sensorgrenze: verbaut ist ein LDS-03 (Messbereich 0.05-12 m, +/-10 mm bis 1 m,
# 0,9 Grad, 10 Hz). Er meldet range_min = 0.05 m, alles darunter wird verworfen.
# Bei 0.15 m bleibt also ein 10 cm breites Band, in dem der Not-Aus ausloesen
# kann -- bei 0,22 m/s und 10 Hz faehrt der Bot pro Scan 2,2 cm, ein Hindernis
# liegt damit in mehreren Scans im Band.
# safety_node warnt beim Start, wenn das Band unter 5 cm liegt (z.B. falls
# emergency_distance gesenkt wird oder ein Sensor mit groesserem range_min
# verbaut ist). 0.15 kommt aus docs/URMC–Technisches_Konzept.md (Notstopp unter
# 0.15 m), das Reglement schreibt keinen Abstand vor.
emergency_distance:  0.15
# Hysterese: erst darueber gilt die Lage wieder als sicher. Muss groesser als
# emergency_distance sein, sonst flattert der Not-Aus an der Schwelle.
release_distance:    0.20
# Mindesthaltezeit in Sekunden, auch wenn der Messwert sofort wieder frei ist.
min_stop_duration:   0.5
# Messwerte darunter sind Artefakte, kein Hindernis.
min_valid_distance:  0.05
# Halbwinkel des ueberwachten Sektors um die Fahrtrichtung, 180.0 = Vollkreis.
# Kleiner stellen, falls Aufbauten am Roboter den Not-Aus faelschlich ausloesen.
check_angle_deg:     180.0
# Anzahl Messpunkte, die unter der Schwelle liegen muessen. 1 ist am
# empfindlichsten, 2-3 unterdrueckt einzelne Ausreisser des LDS.
min_hits:            2
