# Storage-Aufgabe (Palette), gelesen von storage.launch.py. Konzept und Ablauf:
# docs/Storage_Retrieval_Konzept.md. Alle Werte sind Startwerte, am Bot nicht getestet.

/switch_control:
  ros__parameters:
    # Ohne Button faehrt nichts; nach Abbruch zurueck auf Stop.
    initial_mode: Stop
    # Zielzone sagt die Jury an. zone_order nur als Rueckfall oder fuer Tests im Labor:
    # Ziffern in der Reihenfolge, in der die Erkundung die Zonen erreicht, z.B. "3,2,1".
    target_zone: 2
    pallet_zone: 1
    zone_order: ''
    zone_count: 3
    zones_right: true
    boundary_merge_dist: 0.05
    boundary_confirm: 3
    zone_min_width: 0.12
    zone_min_depth: 0.08
    fallback_step: 0.35
    explore_max_distance: 2.5
    sign_settle_time: 0.3
    sign_read_time: 1.5
    sign_read_timeout: 4.0
    sign_min_votes: 3
    sign_min_share: 0.6
    pallet_min_ratio: 0.5
    position_hold_time: 1.0
    # gleich halten mit dock_contact_gap_px in Control_driving_PID_Wide.yaml
    contact_gap_px: 3.0
    contact_frames: 3
    dock_check_gap_px: 30.0
    dock_lateral_tol: 0.15
    dock_timeout: 20.0
    max_attempts: 3
    magnet_on_wait: 1.0
    magnet_off_wait: 1.0
    grip_check_distance: 0.03
    grip_ok_gap_px: 10.0
    pallet_lost_gap_px: 25.0
    pallet_lost_time: 1.0
    # Radachse -> Palettenmitte, wenn sie am Magneten haengt: am Bot messen.
    pallet_center_offset: 0.09
    carry_max_vel: 0.05
    step_timeout: 30.0
    # magnet_controll auf dem Bot; scripts/tb/bot/magnet_node.py hoert auf /magnet/cmd.
    magnet_topic: /lokal/magnet_control

/storage_zone_node:
  ros__parameters:
    zones_right: true
    side_near_m: 0.14
    cross_half_m: 0.08
    min_line_m: 0.05
    max_gap_m: 0.03
    hough_threshold: 30
    max_angle_deg: 30.0

/storage_sign_node:
  ros__parameters:
    enabled: true
    # Vorlagen vor Ort aufnehmen: ros2 param set /storage_sign_node capture_digit <1-3>
    template_dir: '~/.ros/urmc_storage_templates'
    min_area_px: 150
    min_axis_ratio: 0.5
    min_fill_ratio: 0.75
    min_white_ratio: 0.05
    min_score: 0.5
    min_margin: 0.1

/storage_sign_model_node:
  ros__parameters:
    enabled: true
    # leer = aus, bis Gewichte trainiert sind
    model_path: ''
    class_digits: ['1', '2', '3']
    conf_threshold: 0.6
    image_size: 320

/pallet_node:
  ros__parameters:
    # Lage des Magneten im entzerrten Bild (Anteil von Breite bzw. Hoehe): im Debugbild
    # /detect/pallet_debug ablesen. Farbe der Palette dort ebenfalls einstellen.
    magnet_x: 0.5
    magnet_top: 0.85
    roi_top: 0.3
    min_area_px: 200
    min_aspect: 2.0
    max_width: 0.7
