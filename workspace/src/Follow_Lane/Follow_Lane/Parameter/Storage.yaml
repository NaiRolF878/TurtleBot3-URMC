# Storage-Aufgabe (Palette), gelesen von storage.launch.py. Ablauf:
# docs/Storage_Retrieval_Konzept.md.

/switch_control:
  ros__parameters:
    # Ohne Button faehrt nichts; nach Abbruch zurueck auf Stop.
    initial_mode: Stop

/storage_zone_node:
  ros__parameters:
    # Weiss in LAB nach CLAHE.
    lab_l_white_l: 200
    lab_l_white_h: 255
    lab_a_white_l: 112
    lab_a_white_h: 140
    lab_b_white_l: 110
    lab_b_white_h: 145
    # Querlinien ab diesem Abstand (m) von der Bot-Mitte, rechts der Strichelung.
    side_near_m: 0.14
    # Querlinie: hoechstens so viel Grad von der Querrichtung.
    max_angle_deg: 15.0
    # Strichelung: durchgehende Linie ab solid_min_m, Strichluecke bis dash_gap_max_m.
    solid_min_m: 0.08
    dash_gap_max_m: 0.06

/storage_sign_node:
  ros__parameters:
    enabled: true
    # auch ausserhalb SCHILD_LESEN, zum Einstellen
    always_on: false
    # Blau in LAB nach CLAHE.
    lab_l_blue_l: 10
    lab_l_blue_h: 255
    lab_a_blue_l: 135
    lab_a_blue_h: 200
    lab_b_blue_l: 0
    lab_b_blue_h: 105
    # Ziffer: L mindestens.
    white_l_min: 170
    # Vorlage aufnehmen: ros2 param set /storage_sign_node capture_digit <1-3>
    capture_digit: 0

/storage_sign_model_node:
  ros__parameters:
    enabled: true
    # leer = aus, bis Gewichte trainiert sind
    model_path: ''

/pallet_node:
  ros__parameters:
    # Lage des Magneten im entzerrten Bild (Anteil von Breite bzw. Hoehe), im Debugbild
    # /detect/pallet_debug ablesen.
    magnet_x: 0.5
    magnet_top: 0.85
    # Farbe der Palette in LAB nach CLAHE.
    lab_l_pallet_l: 70
    lab_l_pallet_h: 195
    lab_a_pallet_l: 115
    lab_a_pallet_h: 140
    lab_b_pallet_l: 110
    lab_b_pallet_h: 150
