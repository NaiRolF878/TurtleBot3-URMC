# Parameter fuer switch_control im Zonen-Betrieb (zone_avoid.launch.py).
#
# Unterschied zu Switch_Control.yaml: dort entscheidet switch_control selbst per
# LiDAR-Kegel ueber den Obstacle-Modus (fuer den Nav2-Zweig), hier macht das
# avoid_node ueber /avoid/takeover. Zwei Quellen mit verschiedenen Schwellen
# wuerden sich sonst gegenseitig ins Gehege kommen: switch_control haette bei
# 1.0 m schon auf Obstacle geschaltet und damit den PID stummgeschaltet,
# waehrend avoid_node erst ab 0.20 m selbst faehrt -- der Roboter stuende.

# --- Quelle fuer den Lane<->Obstacle-Wechsel ---
obstacle_source: 'avoid'

# --- Fahrbefehl-Mux: 1 /cmd_safe > 2 /cmd_avoid > 3 /cmd_lane ---
cmd_mux_enabled: true
cmd_mux_rate: 20.0
# Aktualitaetsfenster je Quelle. Bleiben Nachrichten laenger aus, faellt der Mux
# auf die naechste Prioritaet zurueck -- und wenn gar nichts mehr kommt, auf
# einen Nullbefehl.
cmd_timeout_safe:  0.5
cmd_timeout_avoid: 0.5
cmd_timeout_lane:  0.5

# --- Wird hier nicht zum Umschalten benutzt (obstacle_source: avoid), ---
# --- muss aber gesetzt sein, weil switch_control die Parameter kennt.  ---
obstacle_check_angle_deg: 20.0
obstacle_trigger_distance: 1.0
obstacle_clear_debounce: 1.0

# --- Tunnel-Austritt (unveraendert gegenueber Switch_Control.yaml) ---
tunnel_exit_open_distance: 1.5
tunnel_exit_open_ratio: 0.8
tunnel_exit_min_lane_pixels: 20
tunnel_exit_debounce: 1.0
