# TESTPROFIL (12.11.2026): wie nav2_params.yaml, aber FollowPath = Regulated Pure Pursuit
# OHNE Kollisionspruefung (use_collision_detection: false). Der Plan von NavFn gilt als wahr,
# der Bot faehrt ihn einfach ab -- Test, ob er so durch enge Luecken kommt.
# Start: tb -> nav2_obstacle_rpp_test.sh. Normalbetrieb: nav2_obstacle.sh (MPPI, unveraendert).
# Bekannt: im Tunnel setzt tunnel_explorer_node FollowPath.vx_max (MPPI) -- schlaegt hier fehl,
# Tunnel mit diesem Profil nicht testen. Kommentare der Originaldatei fehlen (erzeugt per Skript).
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins:
    - progress_checker
    goal_checker_plugins:
    - goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.1
      movement_time_allowance: 3.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 3.15
      stateful: true
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.12
      lookahead_dist: 0.2
      min_lookahead_dist: 0.15
      max_lookahead_dist: 0.35
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: false
      transform_tolerance: 0.1
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.3
      use_collision_detection: false
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.05
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 1.2
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 3.2
      allow_reversing: false
      max_robot_pose_search_dist: 10.0
      use_interpolation: true
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      use_astar: false
      allow_unknown: false
      tolerance: 0.3
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 7
      height: 7
      resolution: 0.01
      robot_radius: 0.09
      track_unknown_space: true
      always_send_full_costmap: true
      plugins:
      - obstacle_layer
      - lane_layer
      - entrance_layer
      - inflation_layer
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        footprint_clearing_enabled: false
        observation_sources: scan
        scan:
          topic: /scan
          sensor_frame: ''
          data_type: LaserScan
          clearing: true
          marking: true
          max_obstacle_height: 2.0
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
          raytrace_max_range: 3.5
          raytrace_min_range: 0.0
          inf_is_valid: true
      lane_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: lane_cloud
        lane_cloud:
          topic: /detect/lane_obstacles
          sensor_frame: ''
          data_type: PointCloud2
          clearing: true
          marking: true
          max_obstacle_height: 2.0
          min_obstacle_height: -1.0
          obstacle_max_range: 2.0
          obstacle_min_range: 0.0
          raytrace_max_range: 2.0
          raytrace_min_range: 0.0
      entrance_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: entrance_cloud blocked_cloud
        entrance_cloud:
          topic: /detect/tunnel_entrance_obstacle
          sensor_frame: ''
          data_type: PointCloud2
          clearing: false
          marking: true
          max_obstacle_height: 2.0
          min_obstacle_height: -1.0
          obstacle_max_range: 100.0
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
        blocked_cloud:
          topic: /tunnel/blocked
          sensor_frame: ''
          data_type: PointCloud2
          clearing: false
          marking: true
          max_obstacle_height: 2.0
          min_obstacle_height: -1.0
          obstacle_max_range: 100.0
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.25
