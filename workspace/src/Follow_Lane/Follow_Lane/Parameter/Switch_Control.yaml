/switch_control:
  ros__parameters:
    # Modus beim Start und nach einem Storage-Abbruch: Lane oder Stop. Storage.yaml setzt Stop.
    initial_mode: Lane

    # --- Eintritt Lane -> Obstacle ---
    # Halbwinkel: 45.0 heisst 90 Grad Gesamtkegel.
    obstacle_check_angle_deg: 45.0
    # LiDAR-Punkt im Kegel naeher als das (m, ab LiDAR) und keine Spurlinie dazwischen
    # -> Obstacle. Kleiner = weniger Weg fuer Nav2 zum Ausweichen.
    obstacle_trigger_distance: 0.30

    # --- Austritt Obstacle -> Lane ---
    # Im Bereich vorn, seitlich und schraeg hinten (270 Grad) nichts naeher als das (m).
    obstacle_clear_distance: 0.40

    # --- Storage (storage_sequence.py) ---
    # Zielzone sagt die Jury an.
    target_zone: 2
    # Ziffern der Zonen in Fahrtrichtung; leer = Schilder entscheiden.
    zone_order: '1,2,3'
    # Gilt nur, wenn in keiner Zone eine Palette gesehen wurde.
    pallet_zone: 1
    # Ohne Zonenmodell: so weit (m) hinter der letzten Querlinie zur Seite drehen; 0 = aus.
    fallback_step: 0.35
    # Nach so viel Strecke (m) endet die Erkundung.
    explore_max_distance: 2.5
    # Andocken (Pixel aus pallet_node): Kontakt ab contact_gap_px, gleich halten mit
    # dock_contact_gap_px in Control_driving_PID_Wide.yaml. Unter dock_check_gap_px und
    # Versatz ueber dock_lateral_tol: neu ansetzen.
    contact_gap_px: 3.0
    dock_check_gap_px: 30.0
    dock_lateral_tol: 0.15
    # Griff geprueft bzw. Palette beim Tragen verloren (Luecke in Pixeln).
    grip_ok_gap_px: 10.0
    pallet_lost_gap_px: 25.0
    # Radachse -> Palettenmitte, wenn sie am Magneten haengt (m): am Bot messen.
    pallet_center_offset: 0.09
    carry_max_vel: 0.05
