/switch_control:
  ros__parameters:
    # Modus beim Start und nach einem Storage-Abbruch: Lane oder Stop.
    initial_mode: Lane

    # --- Eintritt Lane -> Obstacle ---
    # Halbwinkel: 45.0 heisst 90 Grad Gesamtkegel.
    obstacle_check_angle_deg: 45.0
    # LiDAR-Punkt im Kegel naeher als das (m, ab LiDAR) und keine Spurlinie dazwischen
    # -> Obstacle.
    obstacle_trigger_distance: 0.30

    # --- Austritt Obstacle -> Lane ---
    # Im Bereich vorn, seitlich und schraeg hinten (270 Grad) nichts naeher als das (m).
    obstacle_clear_distance: 0.40

    # --- Start-/Ziellinie (YOLO 'start_line') ---
    # An der Linie halten = Lauf beendet (Lane -> Stop, bleibt Stop; aufheben: finish_enabled
    # auf false, z.B. in rqt, oder Pipeline neu starten).
    finish_enabled: true
    # Halt, sobald die Unterkante der Box hoechstens so viele Pixel ueber dem unteren Rand des
    # Rohbilds (800x600) liegt. VOR ORT EINSTELLEN: switch_control schreibt den aktuellen Wert
    # ins Log ("Ziellinie im Bild: Unterkante ... px"), Bot an die gewuenschte Haltestelle
    # stellen und den Wert hier eintragen. Groesser = Halt weiter vor der Linie.
    finish_stop_px: 60.0
    # Starten wir an der Linie? Dann zaehlt sie erst nach finish_arm_distance (m) Fahrt.
    # Standard aus: jede Linie beendet den Lauf.
    start_at_line: false
    finish_arm_distance: 1.0
    # Nur Boxen zaehlen, die die Bildmitte ueberdecken (Linie quer ueber die eigene Spur);
    # ein Schachbrett neben der Fahrbahn zaehlt dann nicht.
    finish_need_center: true

    # --- Storage (storage_sequence.py) ---
    # Zielzone sagt die Jury an.
    target_zone: 2
    # Ziffern der Zonen in Fahrtrichtung; leer = Schilder entscheiden.
    zone_order: '1,2,3'
    # Zone innen (m, zwischen den Linien) und Breite der Linien; vor Ort messen.
    zone_width: 0.235
    zone_depth: 0.17
    line_width: 0.05
    # Ohne Zonenmodell: so weit (m) hinter der letzten Querlinie zur Seite drehen; 0 = aus.
    fallback_step: 0.35
    # Nach so viel Strecke (m) endet die Erkundung.
    explore_max_distance: 2.5
    carry_max_vel: 0.05
