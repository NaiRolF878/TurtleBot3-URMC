# Parameter fuer switch_control (Fahrmodus + Fahrbefehl-Mux).
#
# Flaches Format (name: wert), passend zu load_flat_params im Launch und zu den
# Datei-Knoepfen von rqt_reconfigure.

# --- Fahrbefehl-Mux: 1 /cmd_safe > 2 /cmd_avoid > 3 /cmd_lane ---
# Takt, in dem der Mux seine Auswahl auf /control/cmd_vel schiebt.
cmd_mux_rate: 20.0

# Aktualitaetsfenster je Quelle (Sekunden). Bleiben Nachrichten laenger aus,
# faellt der Mux auf die naechste Prioritaet zurueck -- und wenn gar nichts mehr
# kommt, auf einen Nullbefehl. Genau darueber geben safety_node und avoid_node
# das Steuer wieder ab: sie hoeren einfach auf zu senden.
#
# Nicht zu knapp waehlen: control_driving sendet im Takt von detect_lane
# (kamerabedingt ca. 10 Hz), ein Fenster nahe 0.1 s wuerde die Spurfolge bei
# jedem ausgelassenen Frame kurz auf "none" fallen lassen -- der Bot ruckelt.
cmd_timeout_safe:  0.5
cmd_timeout_avoid: 0.5
cmd_timeout_lane:  0.5
