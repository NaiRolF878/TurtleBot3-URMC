# Nav2 fuer Obstacle und Tunnel: NavFn plant auf der global_costmap, Regulated Pure Pursuit (RPP)
# faehrt auf der local_costmap. Keine Karte, kein AMCL: beide Costmaps fahren im odom-Frame mit.
# - Obstacle: nav2_goal_publisher setzt ein Ziel ~1 m voraus auf der Spurmitte, die
#   Spurlinien kommen als Waende aus lane_costmap_node (lane_layer).
# - Tunnel: tunnel_explorer_node waehlt die Ziele. Beim Eintritt werden beide Costmaps
#   geleert, danach sehen sie nur LiDAR und Eingangssperre.
# controller_server sendet auf /nav2/cmd_vel, control_driving reicht das nur in Obstacle
# und Tunnel weiter (mit Waechter). Beide Costmaps lesen /scan_corrected (scan_correct).

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    # So lange (s) sendet controller_server bei Kollisionsgefahr Null, erst dann bricht er ab:
    # eine einzelne flackernde Zelle beendet die Fahrt nicht.
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    # Im Tunnel setzt tunnel_explorer_node lockerere Werte (TUNNEL_CONTROLLER).
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 3.0

    # Endausrichtung egal: das Ziel rollt mit.
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 3.15
      stateful: true

    # Faehrt den NavFn-Pfad ab. Kollisionspruefung mit dem Umriss der local_costmap, auch beim
    # Drehen auf der Stelle; bei Gefahr bricht das Ziel ab (failure_tolerance), und
    # nav2_goal_publisher bzw. tunnel_explorer_node fahren frei. Im Tunnel setzt
    # tunnel_explorer_node desired_linear_vel herab (TUNNEL_CONTROLLER).
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.12
      lookahead_dist: 0.2
      min_lookahead_dist: 0.15
      max_lookahead_dist: 0.35
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: false
      transform_tolerance: 0.1
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.3
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.05
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 1.2
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 3.2
      # Nicht zusammen mit use_rotate_to_heading.
      allow_reversing: false
      max_robot_pose_search_dist: 10.0
      use_interpolation: true

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      # Humble: mit "/", mit "::" startet planner_server nicht.
      plugin: "nav2_navfn_planner/NavfnPlanner"
      # true -> false (12.11.): mit A* liefen die Wege dicht an Hindernissen entlang; Dijkstra
      # rechnet die ganze Umgebung durch, Wege glatter und mittiger, etwas mehr Rechenzeit.
      use_astar: false
      # Nie durch Unbekanntes.
      allow_unknown: false
      tolerance: 0.3

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      # 2/1 -> 5/2 Hz (12.11.): Hindernisse kamen bis ~1 s spaet in die Karte.
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      # Mitfahrend: kein Odometrie-Reset vor der Fahrt noetig.
      rolling_window: true
      width: 7
      height: 7
      # Ab ~0,6 m liegen die LiDAR-Strahlen weiter als 1 cm auseinander, dazwischen bleibt
      # es unbekannt und fuer NavFn gesperrt.
      resolution: 0.01
      # Kreis fuer NavFn, das nur einen Punkt plant; mit footprint_padding 0,01 gesperrt bis
      # ~0,10 m um jeden LiDAR-Treffer. Der Kreis gilt in alle Richtungen: seitlich ist der Bot
      # nur 0,089 breit, nur die hinteren Ecken reichen 0,105. Der LiDAR misst auf kurze
      # Distanz ~1,7 cm zu kurz (12.11.: Flasche 11,2 cm laut Scan, 12,9 cm echt) -> 0,10 im
      # Scan sind ~0,117 echt, das deckt auch das Heck beim Drehen. 0.105 war zu gross: Bot mit
      # 4 cm Luft stand fuer NavFn in der Sperrzone, kein Plan.
      robot_radius: 0.09
      # Nav2-Standard, hier sichtbar: gesperrt bis robot_radius + Polster (0,0988 als 16-Eck).
      footprint_padding: 0.01
      # Der Tunnel-Explorer sucht die Grenze frei/unbekannt.
      track_unknown_space: true
      always_send_full_costmap: true
      plugins: ["obstacle_layer", "lane_layer", "entrance_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        # Nicht unter dem Kreis robot_radius loeschen (12.11.): der Kreis (~0,10 m) reicht weit
        # ueber die Bot-Front (0,037 m) hinaus, Hindernisse direkt vor dem Bot verschwanden aus
        # der Karte und NavFn plante hindurch. Der LiDAR sieht den eigenen Bot nicht.
        footprint_clearing_enabled: false
        observation_sources: "scan"
        scan:
          topic: /scan_corrected
          sensor_frame: ""
          data_type: "LaserScan"
          clearing: true
          marking: true
          # Pflicht: mit dem Humble-Default 0.0 fallen alle Scanpunkte weg (LiDAR auf 0,182 m).
          max_obstacle_height: 2.0
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
          raytrace_max_range: 3.5
          raytrace_min_range: 0.0
          # Kein Echo (inf) raeumt bis raytrace_max_range frei; sonst bleibt hinter einer
          # Oeffnung alles unbekannt und NavFn plant nicht hinaus.
          inf_is_valid: true

      # Spurwaende wie in local_costmap.
      lane_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: "lane_cloud"
        lane_cloud:
          topic: /detect/lane_obstacles
          sensor_frame: ""
          data_type: "PointCloud2"
          clearing: true
          marking: true
          max_obstacle_height: 2.0
          min_obstacle_height: -1.0
          obstacle_max_range: 2.0
          obstacle_min_range: 0.0
          raytrace_max_range: 2.0
          raytrace_min_range: 0.0

      # Eingangssperre wie in local_costmap.
      entrance_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: "entrance_cloud blocked_cloud"
        entrance_cloud:
          topic: /detect/tunnel_entrance_obstacle
          sensor_frame: ""
          data_type: "PointCloud2"
          clearing: false
          marking: true
          max_obstacle_height: 2.0
          min_obstacle_height: -1.0
          obstacle_max_range: 100.0
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
        # Gesperrte Engstellen (tunnel_explorer_node bzw. nav2_goal_publisher), wie die Eingangssperre.
        blocked_cloud:
          topic: /nav2/blocked
          sensor_frame: ""
          data_type: "PointCloud2"
          clearing: false
          marking: true
          max_obstacle_height: 2.0
          min_obstacle_height: -1.0
          obstacle_max_range: 100.0
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0

      # Nur ueber die Inflation kennt NavFn die Bot-Groesse: bis ~0,10 m (robot_radius +
      # footprint_padding) gesperrt, danach fallend. Radius 0.25 wie HKA (INFLATION_M): NavFn
      # bevorzugt die Mitte von Luecken. Faktor 10: Naehe ist teuer, mit Abstand wird es schnell
      # billig (Faktor 3: im ganzen Saum fast gleich teuer, Wege klebten an Hindernissen).
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 10.0
        inflation_radius: 0.25

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      # Deckt die Vorausschau von RPP (Kollisionspruefung 1 s) und des Waechters mit Rand ab.
      width: 4
      height: 4
      resolution: 0.01
      # Burger relativ zur Radachse (ROBOTIS: 138 x 178 mm, ganz im Kreis r = 105 mm um die
      # Achse): Rumpf 3,7 cm vor bis 10,1 cm hinter der Achse, hinten auf den Kreis
      # abgerundet; Raeder +/-8,9 cm. Derselbe Umriss: robot_geometry.FOOTPRINT (Waechter,
      # Freifahren, Pfadpruefung). Ohne Polster: RPP prueft den echten Umriss.
      footprint_padding: 0.0
      footprint: "[[0.037, -0.069], [0.037, 0.069], [0.033, 0.089], [-0.033, 0.089], [-0.079, 0.069], [-0.092, 0.05], [-0.101, 0.028], [-0.101, -0.028], [-0.092, -0.05], [-0.079, -0.069], [-0.033, -0.089], [0.033, -0.089]]"
      always_send_full_costmap: true
      plugins: ["obstacle_layer", "lane_layer", "entrance_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: "scan"
        scan:
          topic: /scan_corrected
          sensor_frame: ""
          data_type: "LaserScan"
          clearing: true
          marking: true
          # Pflicht: mit dem Humble-Default 0.0 fallen alle Scanpunkte weg (LiDAR auf 0,182 m).
          max_obstacle_height: 2.0
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
          raytrace_max_range: 3.5
          raytrace_min_range: 0.0
          # Kein Echo (inf) raeumt bis raytrace_max_range frei; sonst bleibt hinter einer
          # Oeffnung alles unbekannt und NavFn plant nicht hinaus.
          inf_is_valid: true

      # Spurwaende aus dem Spurgedaechtnis von lane_costmap_node, im Tunnel leer. Jede Wolke
      # enthaelt alle gemerkten Linien: clearing raeumt frei, vergessene verschwinden.
      # Vor inflation_layer, sonst bekommen die Linien keinen Kostensaum.
      lane_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: "lane_cloud"
        lane_cloud:
          topic: /detect/lane_obstacles
          sensor_frame: ""
          data_type: "PointCloud2"
          clearing: true
          marking: true
          max_obstacle_height: 2.0
          min_obstacle_height: -1.0
          obstacle_max_range: 2.0
          obstacle_min_range: 0.0
          raytrace_max_range: 2.0
          raytrace_min_range: 0.0

      # Eingangssperre von keepout_zone_node, Punkte im odom-Frame: Reichweite ab dem
      # odom-Nullpunkt, daher praktisch unbegrenzt. clearing aus: kein echter Sensorursprung.
      entrance_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: "entrance_cloud blocked_cloud"
        entrance_cloud:
          topic: /detect/tunnel_entrance_obstacle
          sensor_frame: ""
          data_type: "PointCloud2"
          clearing: false
          marking: true
          max_obstacle_height: 2.0
          min_obstacle_height: -1.0
          obstacle_max_range: 100.0
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
        # Gesperrte Engstellen (tunnel_explorer_node bzw. nav2_goal_publisher), wie die Eingangssperre.
        blocked_cloud:
          topic: /nav2/blocked
          sensor_frame: ""
          data_type: "PointCloud2"
          clearing: false
          marking: true
          max_obstacle_height: 2.0
          min_obstacle_height: -1.0
          obstacle_max_range: 100.0
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0

      # Kostengefaelle um alle Hindernisse, nur zur Anzeige (nav2_view): RPP prueft den Umriss
      # direkt gegen belegte Zellen.
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 20.0
        inflation_radius: 0.13

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names: ["controller_server", "planner_server"]
