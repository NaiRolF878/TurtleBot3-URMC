# Nav2 fuer Obstacle und Tunnel: NavFn plant auf der global_costmap, MPPI faehrt auf der
# local_costmap. Keine Karte, kein AMCL: beide Costmaps fahren im odom-Frame mit.
# - Obstacle: nav2_goal_publisher setzt ein Ziel ~1 m voraus auf der Spurmitte, die
#   Spurlinien kommen als Waende aus lane_costmap_node (lane_layer).
# - Tunnel: tunnel_explorer_node waehlt die Ziele. Beim Eintritt werden beide Costmaps
#   geleert, danach sehen sie nur LiDAR und Eingangssperre.
# controller_server sendet auf /nav2/cmd_vel, control_driving reicht das nur in Obstacle
# und Tunnel weiter.

controller_server:
  ros__parameters:
    use_sim_time: false
    # = 1 / model_dt, sonst lehnt MPPI configure ab.
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    # Im Tunnel setzt tunnel_explorer_node lockerere Werte (TUNNEL_CONTROLLER).
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 3.0

    # Endausrichtung egal: das Ziel rollt mit.
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 3.15
      stateful: true

    # RotationShim dreht auf der Stelle, wenn der Pfad mehr als angular_dist_threshold
    # abweicht, danach faehrt MPPI. Die MPPI-Parameter stehen weiter unter FollowPath.
    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_mppi_controller::MPPIController"
      # 0.785 (45 Grad) -> 0.35 (20 Grad), 12.11.: darunter fuhr MPPI Boegen statt auf der
      # Stelle zu drehen, der Bot nutzte das Drehen auf der Stelle kaum.
      angular_dist_threshold: 0.35
      forward_sampling_distance: 0.3
      rotate_to_heading_angular_vel: 1.2
      max_angular_accel: 3.2
      simulate_ahead_time: 1.0
      # Vorausschau time_steps * model_dt * vx_max (~1 m) >= goal_distance.
      time_steps: 90
      model_dt: 0.05
      batch_size: 1000
      vx_std: 0.2
      vy_std: 0.0
      # Gross genug, dass enge Kurven und Drehen auf der Stelle vorkommen.
      wz_std: 0.8
      # Burger 0,22 m/s, wie MAX_WHEEL_VEL in control_driving.py.
      vx_max: 0.22
      vx_min: -0.1
      vy_max: 0.0
      wz_max: 1.9
      iteration_count: 1
      # Kleiner als die halbe Breite der local_costmap.
      prune_distance: 1.7
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      # MPPI-Bahnen fuer RViz, kostet Rechenzeit.
      visualize: true
      regenerate_noises: false
      critics:
        - "ConstraintCritic"
        - "CostCritic"
        - "GoalCritic"
        - "GoalAngleCritic"
        - "PathAlignCritic"
        - "PathFollowCritic"
        - "PathAngleCritic"
        - "PreferForwardCritic"
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      # Aus: die Ausrichtung des Ziels ist egal.
      GoalAngleCritic:
        enabled: false
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      # Ausweichen geht vor Pfadtreue: der NavFn-Pfad ist nur eine Vorgabe.
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 20.0
        critical_cost: 600.0
        # Kollision = Umriss (local_costmap.footprint) beruehrt eine belegte Zelle. Den
        # Umriss prueft MPPI nur, wo die Mitte schon Kosten hat (siehe inflation_layer).
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 0.5
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        offset_from_furthest: 5
        # Unter der Pfadlaenge (~1 m), sonst wirkt die Kritik nie.
        threshold_to_consider: 0.5
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      # Humble: mit "/", mit "::" startet planner_server nicht.
      plugin: "nav2_navfn_planner/NavfnPlanner"
      # true -> false (12.11.): mit A* liefen die Wege dicht an Hindernissen entlang; Dijkstra
      # rechnet die ganze Umgebung durch, Wege glatter und mittiger, etwas mehr Rechenzeit.
      use_astar: false
      # Nie durch Unbekanntes.
      allow_unknown: false
      tolerance: 0.3

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      # 2/1 -> 5/2 Hz (12.11.): Hindernisse kamen bis ~1 s spaet in die Karte.
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      # Mitfahrend: kein Odometrie-Reset vor der Fahrt noetig.
      rolling_window: true
      width: 7
      height: 7
      # Ab ~0,6 m liegen die LiDAR-Strahlen weiter als 1 cm auseinander, dazwischen bleibt
      # es unbekannt und fuer NavFn gesperrt.
      resolution: 0.01
      # Kreis fuer NavFn, das nur einen Punkt plant; mit footprint_padding 0,01 gesperrt bis
      # ~0,10 m um jeden LiDAR-Treffer. Der Kreis gilt in alle Richtungen: seitlich ist der Bot
      # nur 0,089 breit, nur die hinteren Ecken reichen 0,105. Der LiDAR misst auf kurze
      # Distanz ~1,7 cm zu kurz (12.11.: Flasche 11,2 cm laut Scan, 12,9 cm echt) -> 0,10 im
      # Scan sind ~0,117 echt, das deckt auch das Heck beim Drehen. 0.105 war zu gross: Bot mit
      # 4 cm Luft stand fuer NavFn in der Sperrzone, kein Plan.
      robot_radius: 0.09
      # Der Tunnel-Explorer sucht die Grenze frei/unbekannt.
      track_unknown_space: true
      always_send_full_costmap: true
      plugins: ["obstacle_layer", "lane_layer", "entrance_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        # Nicht unter dem Kreis robot_radius loeschen (12.11.): der Kreis (~0,10 m) reicht weit
        # ueber die Bot-Front (0,037 m) hinaus, Hindernisse direkt vor dem Bot verschwanden aus
        # der Karte und NavFn plante hindurch. Der LiDAR sieht den eigenen Bot nicht.
        footprint_clearing_enabled: false
        observation_sources: "scan"
        scan:
          topic: /scan
          sensor_frame: ""
          data_type: "LaserScan"
          clearing: true
          marking: true
          # Pflicht: mit dem Humble-Default 0.0 fallen alle Scanpunkte weg (LiDAR auf 0,182 m).
          max_obstacle_height: 2.0
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
          raytrace_max_range: 3.5
          raytrace_min_range: 0.0
          # Kein Echo (inf) raeumt bis raytrace_max_range frei; sonst bleibt hinter einer
          # Oeffnung alles unbekannt und NavFn plant nicht hinaus.
          inf_is_valid: true

      # Spurwaende wie in local_costmap.
      lane_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: "lane_cloud"
        lane_cloud:
          topic: /detect/lane_obstacles
          sensor_frame: ""
          data_type: "PointCloud2"
          clearing: true
          marking: true
          max_obstacle_height: 2.0
          min_obstacle_height: -1.0
          obstacle_max_range: 2.0
          obstacle_min_range: 0.0
          raytrace_max_range: 2.0
          raytrace_min_range: 0.0

      # Eingangssperre wie in local_costmap.
      entrance_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: "entrance_cloud"
        entrance_cloud:
          topic: /detect/tunnel_entrance_obstacle
          sensor_frame: ""
          data_type: "PointCloud2"
          clearing: false
          marking: true
          max_obstacle_height: 2.0
          min_obstacle_height: -1.0
          obstacle_max_range: 100.0
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0

      # Nur ueber die Inflation kennt NavFn die Bot-Groesse: bis ~0,10 m (robot_radius +
      # footprint_padding) gesperrt, danach fallend. inflation_radius >= 0,10.
      # 0.12/20 -> 0.25/6 (12.11.): die Kosten endeten 1,5 cm hinter der Sperrzone, NavFn plante
      # direkt an ihrer Kante entlang (null Abstand, Anfahren im Tunnel). Jetzt bevorzugt er die
      # Mitte von Luecken; gesperrt bleibt nur robot_radius + Padding. Wie HKA (INFLATION_M 0.25).
      # Faktor 6 -> 3 (12.11.): Kosten fallen langsamer ab, mehr Abstand bevorzugt.
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.25

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      # Deckt die MPPI-Vorausschau und prune_distance ab.
      width: 4
      height: 4
      resolution: 0.01
      # Burger relativ zur Radachse (ROBOTIS: 138 x 178 mm, ganz im Kreis r = 105 mm um die
      # Achse): Rumpf 3,7 cm vor bis 10,1 cm hinter der Achse, hinten auf den Kreis
      # abgerundet; Raeder +/-8,9 cm.
      footprint: "[[0.037, -0.069], [0.037, 0.069], [0.033, 0.089], [-0.033, 0.089], [-0.079, 0.069], [-0.092, 0.05], [-0.101, 0.028], [-0.101, -0.028], [-0.092, -0.05], [-0.079, -0.069], [-0.033, -0.089], [0.033, -0.089]]"
      always_send_full_costmap: true
      plugins: ["obstacle_layer", "lane_layer", "entrance_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: "scan"
        scan:
          topic: /scan
          sensor_frame: ""
          data_type: "LaserScan"
          clearing: true
          marking: true
          # Pflicht: mit dem Humble-Default 0.0 fallen alle Scanpunkte weg (LiDAR auf 0,182 m).
          max_obstacle_height: 2.0
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
          raytrace_max_range: 3.5
          raytrace_min_range: 0.0
          # Kein Echo (inf) raeumt bis raytrace_max_range frei; sonst bleibt hinter einer
          # Oeffnung alles unbekannt und NavFn plant nicht hinaus.
          inf_is_valid: true

      # Spurwaende aus dem Spurgedaechtnis von lane_costmap_node, im Tunnel leer. Jede Wolke
      # enthaelt alle gemerkten Linien: clearing raeumt frei, vergessene verschwinden.
      # Vor inflation_layer, sonst bekommen die Linien keinen Kostensaum.
      lane_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: "lane_cloud"
        lane_cloud:
          topic: /detect/lane_obstacles
          sensor_frame: ""
          data_type: "PointCloud2"
          clearing: true
          marking: true
          max_obstacle_height: 2.0
          min_obstacle_height: -1.0
          obstacle_max_range: 2.0
          obstacle_min_range: 0.0
          raytrace_max_range: 2.0
          raytrace_min_range: 0.0

      # Eingangssperre von keepout_zone_node, Punkte im odom-Frame: Reichweite ab dem
      # odom-Nullpunkt, daher praktisch unbegrenzt. clearing aus: kein echter Sensorursprung.
      entrance_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: "entrance_cloud"
        entrance_cloud:
          topic: /detect/tunnel_entrance_obstacle
          sensor_frame: ""
          data_type: "PointCloud2"
          clearing: false
          marking: true
          max_obstacle_height: 2.0
          min_obstacle_height: -1.0
          obstacle_max_range: 100.0
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0

      # Kostengefaelle um alle Hindernisse, keine harte Grenze. MPPI prueft den Umriss nur,
      # wo die Mitte Kosten hat: inflation_radius >= Umkreis mit footprint_padding (0,119).
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 20.0
        inflation_radius: 0.13

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names: ["controller_server", "planner_server"]
