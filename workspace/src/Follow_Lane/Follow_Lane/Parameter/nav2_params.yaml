# Nav2-Konfiguration fuer zwei Faelle. Beide nutzen planner_server (NavFn auf der
# global_costmap) und controller_server (MPPI auf der local_costmap). Keine
# gespeicherte Karte, kein AMCL, kein SLAM: beide Costmaps fahren im odom-Frame mit,
# fuer die kurzen Abschnitte reicht reine Odometrie.
#
# 1) Obstacle-Modus und Tunnel-Einfahrt (TunnelEntry, bis kurz vor die Oeffnung):
#    nav2_goal_publisher laesst planner_server etwa jede Sekunde einen
#    Weg zu einem Punkt ~1 m voraus auf der Spurmitte rechnen, um die
#    LiDAR-Hindernisse herum und zwischen den Spurlinien (lane_layer, gespeist aus dem
#    Spurgedaechtnis von lane_costmap_node). MPPI faehrt ihn ab und prueft dabei
#    Kollisionen mit dem echten Footprint des Burger (local_costmap.footprint). Die
#    Breite des Hindernisbereichs muss nirgends eingestellt werden.
#
# 2) Tunnel-Exploration: tunnel_explorer_node sucht auf der global_costmap
#    Frontier-Punkte (Rand zwischen bekannt-frei und unbekannt) und laesst
#    planner_server (allow_unknown:false, plant also nie ins Unbekannte) einen Pfad
#    dorthin rechnen. Die Kamera ist im Tunnel laut Reglement verboten: beide
#    lane_layer bleiben leer (lane_costmap_node sendet nichts), die Costmaps werden
#    beim Wechsel von TunnelEntry nach Tunnel geleert und sehen danach nur LiDAR und
#    Eingangssperre; die Tunnelkarte bleibt bis zum Austritt.
#
# Fahrbefehle: controller_server sendet auf /nav2/cmd_vel (Remap in
# nav2_obstacle.launch.py). control_driving reicht sie nur in Obstacle, TunnelEntry
# und Tunnel unveraendert weiter; die Grenzen hier (vx_max, wz_max) gelten also
# direkt fuer den Bot.
#
# Warum MPPI und nicht DWB: NavFn plant fuer einen Punkt mit robot_radius und kennt
# die Form des Bots nicht, der Pfad ist also nur eine grobe Vorgabe. MPPIs
# Sampling-Ansatz bewertet viele Kurzfrist-Trajektorien direkt gegen die Costmap mit
# dem echten Footprint und weicht lokal ab, wo der Pfad zu eng ist. DWBs Kritiken
# (PathDist, Oscillation, ...) halten sich enger an den Pfad.
#
# TurtleBot3 Burger: footprint/robot_radius/vx_max/wz_max unten an die
# Burger-Spezifikation angelehnt (138 x 178 mm, 0.22 m/s, ~2.84 rad/s max).

controller_server:
  ros__parameters:
    use_sim_time: false
    # 20 Hz = Periode 0.05 s = model_dt des MPPI weiter unten. MPPI lehnt configure sonst
    # ab ("Controller period more then model dt") und der ganze Nav2-Zweig bleibt inaktiv.
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      # Kurz: haengt MPPI am Hindernis, bricht das Ziel nach 3 s ab und
      # nav2_goal_publisher setzt ein neues, statt dass der Bot lange dagegen drueckt.
      movement_time_allowance: 3.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 3.15
      stateful: true

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      # Vorausschau 90 * model_dt 0.05 = 4,5 s, * vx_max 0.22 m/s ~ 0,99 m: deckt das
      # Planziel von nav2_goal_publisher ab (goal_distance 1.0 m in Lane_Costmap.yaml).
      # Regel: time_steps * model_dt * vx_max >= goal_distance.
      time_steps: 90
      model_dt: 0.05
      batch_size: 1000
      vx_std: 0.2
      vy_std: 0.0
      wz_std: 0.4
      vx_max: 0.22
      vx_min: -0.1
      vy_max: 0.0
      wz_max: 1.9
      iteration_count: 1
      # Haengt an local_costmap.width/height: muss kleiner bleiben als die halbe
      # Kartenbreite (2.0 m bei 4x4), sonst reicht der Pfad ueber die Karte hinaus.
      prune_distance: 1.7
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      # true = MPPI veroeffentlicht die simulierten/gewaehlte Trajektorie zur
      # Kontrolle in RViz2 (Topics unterhalb von /controller_server, z.B.
      # ".../transformed_global_plan" und Marker der Rollouts). Kostet
      # zusaetzliche CPU/Bandbreite -- zum Tunen an, am Wettkampftag ggf.
      # zurueck auf false stellen.
      visualize: true
      regenerate_noises: false
      critics:
        - "ConstraintCritic"
        - "CostCritic"
        - "GoalCritic"
        - "GoalAngleCritic"
        - "PathAlignCritic"
        - "PathFollowCritic"
        - "PathAngleCritic"
        - "PreferForwardCritic"
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      # Aus: das Planziel wird jede Sekunde neu gesetzt, seine Endausrichtung ist
      # irrelevant. goal_checker laesst es mit yaw_goal_tolerance 3.15 ohnehin
      # durchgehen. An wuerde die Kritik den Bot ab 0,5 m vor dem Ziel auf dessen
      # Ausrichtung drehen, auch wenn er gerade an einem Hindernis vorbei muss.
      GoalAngleCritic:
        enabled: false
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      # Gewichte weichen von Nav2s Beispiel ab: Ausweichen dominiert, "auf dem Pfad
      # bleiben" ist nur ein Hinweis. Der Pfad kommt von NavFn, das fuer einen Kreis
      # (robot_radius) plant; wo er fuer den echten Footprint zu eng ist oder ein
      # Hindernis seit der letzten Planung dazukam, soll MPPI abweichen. Mit Nav2s
      # PathAlign 14.0 schob MPPI ein Hindernis vor sich her, das auf dem Pfad lag.
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 20.0
        critical_cost: 600.0
        # true: Kollision heisst, der echte Footprint (local_costmap.footprint)
        # beruehrt eine belegte Zelle -- nicht ein Kreis um den Mittelpunkt. Nur so
        # muss die Korridorbreite zwischen den Spurlinien nirgends eingestellt
        # werden. MPPI prueft den Footprint nur, wo die Kosten am Mittelpunkt schon
        # erhoeht sind; deshalb muss der lane_layer VOR dem inflation_layer stehen,
        # sonst bekommen die Linien keinen Kostensaum und werden uebersehen.
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 0.5
      PathAlignCritic:
        enabled: true
        cost_power: 1
        # Klein, siehe Begruendung bei CostCritic.
        cost_weight: 2.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
      PathFollowCritic:
        enabled: true
        cost_power: 1
        # Haelt den Vorwaertsdrang, ohne das Ausweichen zu ueberstimmen.
        cost_weight: 3.0
        offset_from_furthest: 5
        # MPPI wertet diese Kritik nur aus, wenn das Ziel weiter weg ist als der
        # Schwellwert. Er muss deutlich unter der Pfadlaenge (~1 m) liegen, sonst
        # greift ausgerechnet die Kritik nie, die den Vorwaertsdrang halten soll.
        threshold_to_consider: 0.5
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0

# Bahnplaner fuer beide Faelle: im Obstacle-Modus der Weg um die Hindernisse
# (nav2_goal_publisher), im Tunnel der Weg zu Frontier-Punkten (tunnel_explorer_node).
# Nur durch bekanntes, freies Gebiet (allow_unknown:false), nie ins Unerkundete.
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      # Schraegstrich, nicht "::": nav2_navfn_planner registriert sich in Humble als
      # nav2_navfn_planner/NavfnPlanner. Die "::"-Schreibweise kam erst mit Iron und
      # laesst planner_server hier mit "class ... does not exist" abstuerzen.
      # Die uebrigen Plugins in dieser Datei laden mit "::" korrekt -- das ist je
      # nach Paket unterschiedlich.
      plugin: "nav2_navfn_planner/NavfnPlanner"
      use_astar: true
      allow_unknown: false
      tolerance: 0.3

# Karte des Bahnplaners: mitfahrend wie local_costmap, aber groesser. Sie merkt sich
# das Gesehene, solange es im Fenster um den Roboter liegt -- was hinten
# herausrollt, ist vergessen. Im Tunnel ist sie die Tunnelkarte: keepout_zone_node
# leert sie bei jedem Tunnel-Eintritt, danach kommen nur LiDAR und Eingangssperre
# hinein. Die Zellen liegen im odom-Frame; tunnel_explorer_node liest den
# Kartenursprung bei jeder Nachricht neu aus info.origin und kommt mit dem
# wandernden Fenster zurecht.
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: odom
      robot_base_frame: base_footprint
      # Mitfahrend: fest im odom-Nullpunkt verankert muesste die Karte den Bereich
      # abdecken, in dem der Tunnel relativ zur Odometrie-Nullposition liegt. Traegt
      # man den Bot zwischen Testfahrten von Hand zurueck, drehen die Raeder nicht
      # und die Odometrie laeuft weiter; der Bot laege bald rechnerisch ausserhalb
      # der Karte. So entfaellt ein Odometrie-Reset vor jeder Fahrt. origin_x/origin_y
      # werden bei rolling_window ignoriert.
      rolling_window: true
      # Halbe Kartenbreite 3,5 m ~ Reichweite, die der LDS-03 halten kann. Er misst
      # bis 12 m, bei 0,9 Grad Winkelaufloesung liegen die Strahlen aber ab ~3,2 m
      # weiter auseinander als 5 cm; ab dort wird das Freiraeumen lueckenhaft und
      # schmale Hindernisse fallen zwischen zwei Strahlen durch.
      width: 7
      height: 7
      # Wie local_costmap. 7x7 m -> 280x280 Zellen. Bei 0.05 auch
      # tunnel_explorer_node.min_frontier_cluster_cells (Lane_Costmap.yaml) halbieren,
      # er zaehlt Zellen.
      resolution: 0.025
      # Kreis statt Footprint: NavFn plant fuer einen Punkt und prueft keine
      # Roboterform. 0.105 liegt 1,6 cm ueber der halben Breite des Burger
      # (178 mm) -- in der Enclosure kostet jede Wandberuehrung einen Punkt.
      robot_radius: 0.105
      # Nie gesehene Zellen bleiben "unbekannt" (-1), statt als frei zu gelten. Der
      # Tunnel-Explorer sucht genau die Grenze frei/unbekannt; ohne das findet er nie
      # ein Ziel. Zusammen mit allow_unknown:false plant NavFn nur durch Gesehenes.
      track_unknown_space: true
      always_send_full_costmap: true
      plugins: ["obstacle_layer", "lane_layer", "entrance_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: "scan"
        scan:
          topic: /scan
          sensor_frame: ""
          data_type: "LaserScan"
          clearing: true
          marking: true
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
          raytrace_max_range: 3.5
          raytrace_min_range: 0.0

      # Dieselben Spurwaende wie in local_costmap (siehe dortiger Kommentar), damit
      # der Bahnplaner im Obstacle-Modus zwischen den Linien plant. Im Tunnel leer.
      lane_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: "lane_cloud"
        lane_cloud:
          topic: /detect/lane_obstacles
          sensor_frame: ""
          data_type: "PointCloud2"
          clearing: true
          marking: true
          max_obstacle_height: 2.0
          min_obstacle_height: -1.0
          obstacle_max_range: 2.0
          obstacle_min_range: 0.0
          raytrace_max_range: 2.0
          raytrace_min_range: 0.0

      # Dieselbe Eingangs-Sperrzone wie in local_costmap (siehe dortiger
      # Kommentar) -- sorgt dafuer, dass planner_server erst gar keinen Pfad
      # zurueck durch den Eingang vorschlaegt.
      entrance_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: "entrance_cloud"
        entrance_cloud:
          topic: /detect/tunnel_entrance_obstacle
          sensor_frame: ""
          data_type: "PointCloud2"
          clearing: false
          marking: true
          max_obstacle_height: 2.0
          min_obstacle_height: -1.0
          # Die Wolke kommt im odom-Frame, die Reichweite zaehlt deshalb ab dem
          # odom-Nullpunkt, nicht ab dem Bot. Ein Wert wie 3.0 liesse die Sperre still
          # wegfallen, sobald der Eingang weiter vom Startpunkt entfernt liegt. Praktisch
          # unbegrenzt: was ausserhalb des mitfahrenden Fensters liegt, verwirft
          # die Costmap ohnehin. raytrace_* wirkt wegen clearing:false nicht.
          obstacle_max_range: 100.0
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.3

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      # 2 m je Richtung: deckt die MPPI-Vorausschau (~1 m, time_steps * model_dt *
      # vx_max) und prune_distance 1.7 ab. Groesser kostet bei update_frequency
      # 10 Hz nur Rechenzeit.
      width: 4
      height: 4
      # Spurlinien (~2 cm) und Hindernisraender werden feiner als bei 5 cm, aber ~4x
      # so viele Zellen. Auf 0.05, falls controller_server seine 20 Hz nicht schafft
      # ("Control loop missed its desired rate").
      resolution: 0.025
      # Umriss des Burger relativ zu base_footprint (Radachse), aus 138 x 178 mm
      # und der URDF: Rumpf 3,7 cm vor bis 10,1 cm hinter der Achse, +/-6,9 cm
      # breit; Raeder +/-8,9 cm aussen, 3,3 cm Radius. Konvexe Huelle aus beidem.
      # Gilt fuer alle Burger gleich, Umbauten sind laut Reglement verboten.
      footprint: "[[0.037, -0.069], [0.037, 0.069], [0.033, 0.089], [-0.033, 0.089], [-0.101, 0.069], [-0.101, -0.069], [-0.033, -0.089], [0.033, -0.089]]"
      always_send_full_costmap: true
      plugins: ["obstacle_layer", "lane_layer", "entrance_layer", "inflation_layer"]

      # Layer 1: echte Hindernisse vom 360 Grad LiDAR.
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: "scan"
        scan:
          topic: /scan
          sensor_frame: ""
          data_type: "LaserScan"
          clearing: true
          marking: true
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
          raytrace_max_range: 3.5
          raytrace_min_range: 0.0

      # Layer 2: virtuelle Waende aus dem Spurgedaechtnis von lane_costmap_node ueber
      # /detect/lane_obstacles (PointCloud2, base_footprint). Die Wolke enthaelt jedes
      # Mal alle gemerkten Linienzellen im Umkreis memory_radius (2.0 m = Reichweite
      # hier). clearing:true raeumt per Strahl vom Bot aus frei und traegt danach
      # alle Punkte wieder ein: gemerkte Linien bleiben, vergessene verschwinden.
      # Muss vor inflation_layer stehen (siehe CostCritic). Im Tunnel-Modus leer:
      # lane_costmap_node sendet dort nichts und leert beim Eintritt die Karte
      # (Kamera laut Reglement verboten).
      lane_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: "lane_cloud"
        lane_cloud:
          topic: /detect/lane_obstacles
          sensor_frame: ""
          data_type: "PointCloud2"
          clearing: true
          marking: true
          max_obstacle_height: 2.0
          min_obstacle_height: -1.0
          obstacle_max_range: 2.0
          obstacle_min_range: 0.0
          raytrace_max_range: 2.0
          raytrace_min_range: 0.0

      # Layer 3: die einmalig gemerkte Tunnel-Eingangs-Sperrzone von
      # keepout_zone_node ueber /detect/tunnel_entrance_obstacle (PointCloud2,
      # im odom-Frame, deshalb ortsfest statt roboter-relativ). clearing:false
      # ist hier bewusst -- es gibt keinen echten Sensor-Ursprung fuer diese
      # virtuellen Punkte, ein Raytrace-Clearing wuerde entlang einer
      # willkuerlichen Linie im odom-Frame echte Hindernisse mit-loeschen.
      # Ausserhalb des Tunnel-Modus veroeffentlicht keepout_zone_node nichts,
      # der Layer bleibt dann einfach leer.
      entrance_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: "entrance_cloud"
        entrance_cloud:
          topic: /detect/tunnel_entrance_obstacle
          sensor_frame: ""
          data_type: "PointCloud2"
          clearing: false
          marking: true
          max_obstacle_height: 2.0
          min_obstacle_height: -1.0
          # Die Wolke kommt im odom-Frame, die Reichweite zaehlt deshalb ab dem
          # odom-Nullpunkt, nicht ab dem Bot. Ein Wert wie 3.0 liesse die Sperre still
          # wegfallen, sobald der Eingang weiter vom Startpunkt entfernt liegt. Praktisch
          # unbegrenzt: was ausserhalb des mitfahrenden Fensters liegt, verwirft
          # die Costmap ohnehin. raytrace_* wirkt wegen clearing:false nicht.
          obstacle_max_range: 100.0
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0

      # Kostengradient um alle Layer: LiDAR-Hindernisse, Spurlinien,
      # Enclosure-Waende, Eingangssperre. Ohne ihn haette die Zelle direkt neben
      # einer Wand noch Kosten 0 und der Regler wiche erst im letzten Moment aus.
      # Kein Kollisionskriterium -- das ist der Footprint. Ueberlappen sich die
      # Saeume beider Spurlinien in einem schmalen Korridor, bleibt die Mitte trotzdem
      # die guenstigste Stelle; deshalb haengt der Wert nicht an der Spurbreite.
      # Muss groesser bleiben als der Umkreis des Footprints (0.122 m plus Nav2s
      # footprint_padding, Standard 0.01), sonst prueft MPPI den Footprint nicht
      # mehr rechtzeitig. Gewaehlt, nicht vermessen.
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.20

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names: ["controller_server", "planner_server"]
