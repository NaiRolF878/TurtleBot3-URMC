# =============================================================================
#  docker-compose.yml – TurtleBot3 URMC
# =============================================================================
#  Verwendung:
#    Linux  (X11):   docker compose up -d
#    Windows(noVNC): Kommentare unten tauschen, dann docker compose up -d
# =============================================================================

services:
  turtlebot3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tb3_urmc
    stdin_open: true
    tty: true

    environment:
      - TURTLEBOT3_MODEL=burger
      - ROS_DOMAIN_ID=30
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - GZ_VERSION=harmonic

      # ── X11 für Linux (aktiv) ──
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1

      # ── noVNC für Windows (bei Bedarf aktivieren) ──
      # - DISPLAY=:1
      # - QT_QPA_PLATFORM=xcb

    volumes:
      # Workspace-Mount: dein Code bleibt auf dem Host
      - ./workspace:/workspace

      # ── X11 für Linux (aktiv) ──
      - /tmp/.X11-unix:/tmp/.X11-unix:rw

      # GPU-Zugriff (nur Linux mit NVIDIA):
      # - /dev/dri:/dev/dri

    # ── X11 für Linux: Netzwerk-Modus ──
    network_mode: host

    # ── noVNC für Windows (bei Bedarf aktivieren) ──
    # ports:
    #   - "6080:6080"   # noVNC Web-GUI
    #   - "5901:5901"   # VNC direkt
    # network_mode: bridge

    # GPU-Unterstützung (nur Linux mit NVIDIA)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
