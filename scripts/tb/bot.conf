# Welcher TurtleBot wird angesprochen? Wird von allen scripts/tb/*.sh gesourct.
#
# Bot wechseln: unten BOT=... aendern. Einmalig ohne Dateiaenderung:
#     BOT=gertrude botup
#
# Pro Bot:
#   BOT_MAC        zum Finden der IP (find-bot-ip.sh) -- die IP wechselt per DHCP, die MAC nicht
#   BOT_USER       Login auf dem Bot (ssh)
#   BOT_DOMAIN_ID  ROS_DOMAIN_ID -- muss zur ~/.bashrc auf dem Bot passen, sonst sieht der
#                  Laptop keine Topics. Gleiche ID wie ein anderer Bot im selben WLAN heisst:
#                  man sieht dessen /cmd_vel und kann ihn versehentlich fahren!

BOT="${BOT:-gertrude}"
# Exportieren, damit aufgerufene Skripte (find-bot-ip, cam-mode, ...) denselben Bot nehmen --
# auch wenn bot.conf zwischendurch geaendert wird (z.B. waehrend der Launcher laeuft).
export BOT

case "$BOT" in
    gertrude)   # unser Bot, Pi Cam 2 (IMX219)
        BOT_MAC="2C:CF:67:47:38:54"
        BOT_USER="gertrude"
        BOT_DOMAIN_ID=33
        ;;
    tb1)        # Bot des anderen Teams, Pi Cam 3 (IMX708). Gefunden als tb1.lan.
        BOT_MAC="2C:CF:67:47:38:8D"
        BOT_USER="tb1"
        BOT_DOMAIN_ID=30
        ;;
    *)
        echo "bot.conf: unbekannter Bot '$BOT' (bekannt: gertrude, tb1)" >&2
        return 1 2>/dev/null || exit 1
        ;;
esac
