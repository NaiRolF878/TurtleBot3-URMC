# Laptop als Zeitserver fuer den Bot im Kabelnetz (gestartet von time-server.sh).
# chronyd laeuft mit -x: er stellt die Laptop-Uhr NICHT (das macht der Host per NTP aus dem
# Internet), er gibt sie nur weiter. Ohne eigene Quelle zaehlt die lokale Uhr ("local").
local stratum 8
allow 192.168.77.0/24
pidfile /run/chronyd-urmc.pid
